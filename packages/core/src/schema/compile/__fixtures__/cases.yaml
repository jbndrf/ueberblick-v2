- name: classify names a property that is not a select
  code: classify_property_invalid
  path: types.baum.classify.property
  set: { types.baum.classify: { property: befund, values: {} } }
- name: classify value is not an option
  code: classify_value_unknown
  path: types.baum.classify.values.nix
  set: { types.baum.classify: { property: stage, values: { nix: { color: '#ff0000' } } } }
- name: marker icon svg holds a script
  code: marker_icon_invalid
  path: types.baum.marker.icon.svg
  set: { types.baum.marker: { icon: { svg: '<svg><script>x</script></svg>' } } }
- name: children drawn at the parent but the child type has a geometry of its own
  code: inherit_with_own_geometry
  path: types.baum.relations.massnahmen.inherit_position
  set:
