scenario: bind_undeclared_write_refused
title: "A task cannot write a related feature that its bind does not declare"
foundations: [F3, F9]
capabilities: [bind, permission_write]
given:
  project: projects/musterstadt-plain.yaml
  include: [seeds/musterstadt-geo.yaml]
  now: "2026-05-01T08:00:00Z"
when:
  - id: s1                                # input tries to reach the area through a key that is no declared bind
    kind: run
    task: kontrolle
    actor: anna
    feature: t_in
    input: { vitalitaet: "v2", befund: neuer Befund, "park.name": Umbenannt }
then:
  steps:
    s1: { outcome: refused, refusal: bind_undeclared, no_trace: true }
  features:
    park: { properties: { name: Spielplatz Nord } }
