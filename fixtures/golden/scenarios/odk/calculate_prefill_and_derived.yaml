scenario: calculate_prefill_and_derived
title: "calculate prefills from the current value and computes readonly values, and the run stores the result"
foundations: [F3, F4, F5]
capabilities: [odk_calculate, odk_readonly]
given:
  project: projects/musterstadt-plain.yaml
  include: [seeds/musterstadt-geo.yaml]
  now: "2026-05-01T08:00:00Z"
when:
  - id: s1                                # the client asks the core for the initial form values
    kind: run
    dry_run: true                         # plan only, nothing is stored (used by the form renderer)
    task: kontrolle
    actor: anna
    feature: t_in
    input: {}
  - id: s2                                # vitalitaet is omitted: calculate fills it from self.vitalitaet; hoehe_klasse is calculated
    kind: run
    task: kontrolle
    actor: anna
    feature: t_in
    input: { befund: Höhe gemessen, hoehe_m: 18 }
  - id: s3                                # a readonly field cannot be supplied
    kind: run
    task: kontrolle
    actor: anna
    feature: t_in
    input: { befund: Wieder ein Befund, hoehe_m: 18, hoehe_klasse: gross }
then:
  steps:
    s1: { outcome: dry_run, form_values: { vitalitaet: "v2" } }
    s2:
      outcome: accepted
      observations:
        - { feature: t_in, property: vitalitaet, result: "v2" }
        - { feature: t_in, property: hoehe_klasse, result: mittel }
    s3: { outcome: refused, refusal: readonly_field, field: hoehe_klasse, no_trace: true }
